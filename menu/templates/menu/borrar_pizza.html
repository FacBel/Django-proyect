<!DOCTYPE html>
<html lang="es">
<head>
{% load static %}
    <meta charset="UTF-8">
    <title>Eliminar Pizza - Rocket Pizza</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="main-header">
        <div class="header-content">
            <h1>Eliminar del Menú</h1>
            <p>Acción irreversible</p>
        </div>
    </header>

    <main class="container">
        <form method="post" class="styled-form danger-form">
            {% csrf_token %}
            <div class="warning-box">
                <h2>¿Estás seguro?</h2>
                <p>Estás a punto de eliminar la siguiente pizza del menú:</p>
                <h3 class="highlight-pizza">{{ pizza }}</h3>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-danger">Sí, eliminar definitivamente</button>
                <a href="{% url 'menu' %}" class="btn btn-outline">No, volver al menú</a>
            </div>
        </form>
    </main>
</body>
</html>
